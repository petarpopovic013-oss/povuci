<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f26" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3e3e" />
      <stop offset="100%" stop-color="#d22e2e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#d22e2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#d22e2e" stroke-width="10" opacity="0.85" />

  <!-- Stylized "P" Lettermark & Trailer Tow Hook / Hitch Accent -->
  <g filter="url(#glow)">
    <!-- Vertical Bar of P -->
    <rect x="110" y="105" width="68" height="302" rx="16" fill="#ffffff" />
    
    <!-- Top Loop of P -->
    <path d="M 178 105 L 290 105 C 365 105 415 145 415 215 C 415 285 365 325 290 325 L 178 325 Z" fill="#ffffff" />
    <path d="M 178 165 L 280 165 C 322 165 350 185 350 215 C 350 245 322 265 280 265 L 178 265 Z" fill="#1c1f26" />
    
    <!-- Red Dynamic Trailer Hitch / .RS Indicator -->
    <circle cx="360" cy="385" r="44" fill="url(#redGrad)" />
    
    <!-- Red Speed/Tow Accent Stripe on P -->
    <path d="M 132 165 L 156 165 L 156 365 L 132 365 Z" fill="url(#redGrad)" />
  </g>
</svg>